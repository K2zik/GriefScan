name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (empty = read from build.gradle)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          GRADLE_VERSION="$(grep -E "^version\s*=" build.gradle | head -n1 | sed -E "s/^version\s*=\s*['\"]?([^'\"]+)['\"]?/\1/")"
          if [ -z "${GRADLE_VERSION}" ]; then
            echo "Could not read version from build.gradle" >&2
            exit 1
          fi

          SHOULD_RELEASE=false
          VERSION=""
          TAG=""

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-$GRADLE_VERSION}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
            SHOULD_RELEASE=true
          elif [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            TAG="${REF_NAME}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE=true
          elif [ "${EVENT_NAME}" = "push" ]; then
            VERSION="${GRADLE_VERSION}"
            TAG="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag ${TAG} already exists — skip auto-release."
              SHOULD_RELEASE=false
            else
              echo "No tag ${TAG} yet — creating release from build.gradle version."
              SHOULD_RELEASE=true
            fi
          fi

          {
            echo "should_release=${SHOULD_RELEASE}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "gradle_version=${GRADLE_VERSION}"
          } >> "$GITHUB_OUTPUT"

          echo "should_release=${SHOULD_RELEASE} version=${VERSION} tag=${TAG}"

      - name: Set up JDK 21
        if: steps.meta.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: steps.meta.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        if: steps.meta.outputs.should_release == 'true'
        run: chmod +x gradlew

      - name: Build
        if: steps.meta.outputs.should_release == 'true'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Create GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GriefScan ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            build/libs/GriefScan.jar
            build/libs/GriefScan-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
